name: Release verification and Pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7

      - name: Use the project Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure public paths
        run: |
          echo "GITHUB_PAGES=true" >> "$GITHUB_ENV"
          echo "PAGES_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Run release verification
        run: npm run verify

      - name: Build the production application
        run: npm run build

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
